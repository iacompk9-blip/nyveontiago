<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#9CFF00">
<title>Nyveon</title>
<style>
:root {
  --green:#9CFF00;
  --green2:#B0FF35;
  --black:#050505;
  --white:#f7fff0;
}
* { box-sizing:border-box; }
html,body {
  margin:0; min-height:100%; background:var(--green); color:var(--black);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body { overflow-x:hidden; }
.page {
  min-height:100vh; width:100%; max-width:520px; margin:auto;
  padding:42px 20px 35px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
}
/* Fundo sutil */
.page::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.25), transparent 25%),
    radial-gradient(circle at 90% 80%, rgba(0,0,0,.06), transparent 30%);
}
.logo {
  width:150px; height:150px; object-fit:contain; position:relative; z-index:3;
  animation:logoIn .78s cubic-bezier(.22,.8,.25,1) both;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.13));
}
@keyframes logoIn {
  0% { opacity:0; transform:rotate(-360deg) scale(.78); }
  65% { opacity:1; transform:rotate(-22deg) scale(1.04); }
  100% { opacity:1; transform:rotate(0) scale(1); }
}
h1 {
  position:relative; z-index:3; margin:9px 0 4px;
  font-size:29px; letter-spacing:-1px; font-weight:900;
}
.subtitle {
  position:relative; z-index:3; margin:0; font-size:14px;
  font-weight:650; opacity:.72;
}
.actions {
  position:relative; z-index:4; width:100%; display:grid;
  gap:13px; margin-top:31px;
}
.btn {
  min-height:61px; border:1px solid rgba(0,0,0,.78);
  border-radius:18px; padding:10px 16px; text-decoration:none;
  color:var(--white); background:rgba(0,0,0,.78);
  display:flex; align-items:center; gap:14px;
  box-shadow:0 8px 22px rgba(0,0,0,.10);
  backdrop-filter:blur(8px);
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}
.btn:hover {
  transform:translateY(-2px);
  background:rgba(0,0,0,.88);
  box-shadow:0 12px 28px rgba(0,0,0,.16);
}
.btn:active { transform:scale(.985); }
.icon {
  width:40px; height:40px; flex:none; border-radius:12px;
  background:var(--green); color:#050505; display:grid; place-items:center;
  font-size:20px; font-weight:900;
}
.text { display:flex; flex-direction:column; gap:2px; text-align:left; }
.text strong { font-size:16px; }
.text small { color:#cbd2c6; font-size:11px; }
.info {
  position:relative; z-index:3; width:100%; margin-top:23px;
  padding:17px 18px; border-radius:19px;
  border:1px solid rgba(0,0,0,.28); background:rgba(255,255,255,.14);
  text-align:center; backdrop-filter:blur(7px);
}
.info strong { font-size:14px; }
.info p { margin:5px 0 0; font-size:12px; opacity:.68; }
.footer {
  position:relative; z-index:3; margin-top:auto; padding-top:30px;
  font-size:10px; font-weight:800; letter-spacing:1.4px; opacity:.42;
}

/* Mini logos "meteoritos": ficam atrás do conteúdo e atravessam lentamente a tela. */
.meteor {
  position:absolute; z-index:1; width:23px; height:23px; object-fit:contain;
  opacity:.26; pointer-events:none; filter:drop-shadow(0 0 7px rgba(0,0,0,.15));
  animation:fall linear infinite;
}
.meteor::after {
  content:""; position:absolute; left:50%; top:-18px; width:2px; height:18px;
  background:linear-gradient(to top, rgba(0,0,0,.20), transparent);
}
.m1 { left:8%;  top:-40px; animation-duration:7.5s; animation-delay:-1s; transform:rotate(-12deg); }
.m2 { left:24%; top:-80px; width:17px; height:17px; animation-duration:9s; animation-delay:-4s; }
.m3 { left:74%; top:-50px; width:20px; height:20px; animation-duration:8.5s; animation-delay:-2s; }
.m4 { left:89%; top:-100px; width:15px; height:15px; animation-duration:10s; animation-delay:-6s; }
.m5 { left:48%; top:-70px; width:14px; height:14px; animation-duration:11s; animation-delay:-8s; }
@keyframes fall {
  0% { transform:translate3d(0,-70px,0) rotate(0deg); opacity:0; }
  8% { opacity:.25; }
  50% { opacity:.18; }
  92% { opacity:.12; }
  100% { transform:translate3d(-35px,115vh,0) rotate(300deg); opacity:0; }
}
@media (prefers-reduced-motion:reduce) {
  .logo,.meteor { animation:none; }
}
.btn .txt small{font-size:10px;opacity:.55;font-weight:500;margin-top:2px}</style>

<style>
.actions .btn .txt{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.15;
}
.actions .btn .txt small{
  display:block;
  margin-top:3px;
  font-size:10px;
  line-height:1;
  font-weight:500;
  opacity:.55;
}
</style>
</head>
